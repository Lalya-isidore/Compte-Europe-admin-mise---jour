      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>
  <!-- Card shape -->
  <rect x="10" y="22" width="60" height="38" rx="5" fill="white" opacity="0.95"/>
