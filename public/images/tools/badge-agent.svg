  <circle cx="26" cy="38" r="3.5" fill="white" opacity="0.9"/>
  <ellipse cx="26" cy="46" rx="5.5" ry="3" fill="white" opacity="0.9"/>
  <!-- Text lines -->
  <rect x="38" y="34" width="24" height="3.5" rx="2" fill="#667eea" opacity="0.8"/>
  <rect x="38" y="40" width="18" height="2.5" rx="2" fill="#9ca3af" opacity="0.7"/>
  <rect x="38" y="45" width="20" height="2.5" rx="2" fill="#9ca3af" opacity="0.6"/>
  <!-- Bottom ID strip -->
  <rect x="10" y="52" width="60" height="8" rx="0" fill="#667eea" opacity="0.25"/>
  <rect x="15" y="54" width="20" height="2" rx="1" fill="#667eea" opacity="0.7"/>
